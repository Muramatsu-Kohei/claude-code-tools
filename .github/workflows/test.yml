# 5 つのツールのうち、テストがある 3 つを回す。
# npm 依存がゼロ(全テストが Node 標準モジュールだけで書かれている)なので install ステップは
# 要らない。テストはいずれも USERPROFILE/HOME を偽ホームに差し替えて動くため、ランナー上の
# 実データを読むことはない。claude-statusline と claude-window-keeper はテストが無いので対象外
# (後者は PowerShell + タスクスケジューラが実体なので、書くとしても windows ランナーが要る)。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # windows を使うのは、対象ツールが Windows 前提(.cmd・PowerShell・%USERPROFILE%・
    # ドライブレター付きパス)だから。ubuntu で試したところ 1521 件中 59 件が落ちた
    # (account-guard のパス判定 56 件と、swap の故障注入 3 件)。いずれもツールの不具合ではなく
    # 実行環境の前提の違いで、緑にするにはテスト側を書き換えるしかない。実際の利用環境が
    # Windows である以上、そちらに CI を合わせるのが筋。public リポジトリなので Windows
    # ランナーでも Actions は無料(実行時間の倍率課金がかかるのは private のみ)。
    runs-on: windows-latest
    # ハングしたまま Actions の実行時間を焼き続けないための上限。全体の実測は 2 分弱なので
    # 15 分あれば通常実行が引っかかることはない(テスト側にもランナー・子プロセスの
    # 二段でタイムアウトを入れてあり、これは最後の砦)。
    timeout-minutes: 15

    steps:
      # v4 系は action 自体が Node 20 ランタイムで動く実装で、ランナー側から非推奨の
      # 警告が出る(Node 24 に強制的に載せ替えられて動いてはいる)。警告を消すため v7 系に上げる。
      # これは action の実装が動くランタイムの話で、下の node-version(テストを実行する
      # Node のバージョン)とは別物。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # ローカルの開発環境(v20.13.1)に合わせる。上げるときはローカルも揃えること。
          # なお Node 20 自体は既に EOL に入っている。ローカルを上げる際はここも一緒に上げる。
          node-version: '20'

      - name: account-guard
        working-directory: account-guard
        run: node test/run.js

      - name: claude-worklog
        working-directory: claude-worklog
        run: node test/run.js

      - name: usage-tracker
        working-directory: usage-tracker
        run: node test/run.js
